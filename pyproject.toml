[project]
name = "gh-project-monitor"
version = "0.1.0"
description = "Monitor GitHub project status using gh CLI with TOON, Markdown, and HTML output"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12.0",
    "toon-llm>=0.1.0",
    "jinja2>=3.1.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[project.scripts]
gh-monitor = "gh_monitor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gh_monitor"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "C90"]
ignore = ["B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "N806"]
"gh_monitor/collector.py" = ["S603", "S607"]
"gh_monitor/syncer.py" = ["S603", "S607"]
"gh_monitor/generators/*.py" = ["S701"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=gh_monitor --cov-report=html --cov-report=term"

[dependency-groups]
dev = [
    "biston>=0.7.2",
    "gerenuk>=0.3.0",
    "madoqua>=0.2.1",
    "pycoati>=0.2.6",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
    "ty>=0.0.78",
    "ty-find>=0.5.0",
    "zorilla>=0.2.1",
]

[tool.madoqua]
# fix phase keeps the defaults: ruff check --fix, ruff format (re-staged).
# check phase keeps the defaults (ruff check, ty check) and adds:
extend_check = [
    # madoqua appends the staged .py files. biston reads them as --focus-args focus files
    # (only clone pairs touching a staged file); zorilla lints exactly those files.
    { name = "biston",  cmd = "biston scan --focus-args", timeout_s = 60,  max_output_lines = 80 },
    { name = "zorilla", cmd = "zorilla check",            timeout_s = 30,  max_output_lines = 80 },
    # gerenuk scopes itself from the git diff, so no file list.
    { name = "gerenuk", cmd = "gerenuk run -- -q",        pass_files = false, timeout_s = 120, max_output_lines = 120 },
]

[tool.biston.scan]
exclude = ["tests/**"]
